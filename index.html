<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Lager App</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#333333">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body {
  font-family: Arial;
  margin: 0;
}

nav {
  display: flex;
  background: #333;
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  z-index: 1000;
}

nav button {
  flex: 1;
  padding: 14px 6px;
  color: white;
  background: none;
  border: none;
  font-size: 16px; /* größer */
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  min-height: 80px; /* deutlich größere Touchfläche */
}

.tab {
  margin-bottom: 80px; /* Platz für Bottom Navigation */
  display: none;
  padding: 10px;
}

input, select, button {
  width: 100%;
  padding: 12px;
  margin: 5px 0;
  font-size: 16px;
}

.card {
  border: 1px solid #ccc;
  padding: 10px;
  margin: 10px 0;
}
</style>
</head>

<body>

<nav>
  <button onclick="showTab('inventur')">📦<br>Inventur</button>
  <button onclick="showTab('eingang')">➕<br>Eingang</button>
  <button onclick="showTab('admin')">📊<br>Bestand</button>
  <button onclick="showTab('export')">📤<br>Export</button>
</nav>

<div id="inventur" class="tab"></div>
<div id="eingang" class="tab"></div>
<div id="admin" class="tab"></div>
<div id="export" class="tab"></div>

<script>
// ---------------- SUPABASE ----------------
const client = window.supabase.createClient(
  "https://hptmgzugsfxbkxayoqwk.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhwdG1nenVnc2Z4Ymt4YXlvcXdrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5Njc1OTEsImV4cCI6MjA5MjU0MzU5MX0.wqIL8sXUMF9E5PBdHMBcY6d6fvPeEzU93GG4PNT7h2Y"
);

let artikel = [];
let bewegungen = [];

// ---------------- TAB SYSTEM ----------------
window.showTab = function(tab) {
  document.querySelectorAll(".tab").forEach(el => {
    el.style.display = "none";
  });

  const target = document.getElementById(tab);
  if (target) target.style.display = "block";

  if (tab === "inventur") renderInventur();
  if (tab === "eingang") renderEingang();
  if (tab === "admin") renderAdmin();
  if (tab === "export") renderExport();
};

// ---------------- LOAD ----------------
async function load(initialTab = null) {
  try {
    const { data: artikelData } = await client.from("artikel").select("*");
    const { data: bewegungenData } = await client.from("lagerbewegungen").select("*");

    artikel = artikelData || [];
    bewegungen = bewegungenData || [];

    if (initialTab) {
      showTab(initialTab);
    }

  } catch (err) {
    console.error("LOAD CRASH:", err);
  }
} catch (err) {
    console.error("LOAD CRASH:", err);
  }
}

// ---------------- HELPER ----------------
function bestand(id) {
  return bewegungen
    .filter(b => b.artikel_id === id)
    .reduce((sum, b) => sum + b.menge, 0);
}

// ---------------- INVENTUR ----------------
function renderInventur() {
  let html = `<h2>📦 Inventur</h2>

  <select id="filter_standort" onchange="filterInventur()">
    <option value="">Alle Standorte</option>
    ${[...new Set(artikel.map(a => a.standort || ""))].map(s => `<option value="${s}">${s}</option>`).join("")}
  </select>

  <select id="filter_lagerplatz" onchange="filterInventur()">
    <option value="">Alle Lagerplätze</option>
    ${[...new Set(artikel.map(a => a.lagerplatz || ""))].map(l => `<option value="${l}">${l}</option>`).join("")}
  </select>

  <div id="inventurListe"></div>`;

  document.getElementById("inventur").innerHTML = html;

  renderInventurListe(artikel);
}

function renderInventurListe(liste) {
  let html = "";

  liste.forEach(a => {
    html += `
    <div class="card">
      <b>ID: ${a.id}</b><br>
      Name: ${a.name}<br>
      📍 ${a.lagerplatz}<br>
      Bestand: ${bestand(a.id)}<br>
      Ist:
      <input type="number" onchange="inventur(${a.id}, this.value)">
    </div>`;
  });

  document.getElementById("inventurListe").innerHTML = html;
}

function filterInventur() {
  const standort = document.getElementById("filter_standort").value.toLowerCase();
  const lagerplatz = document.getElementById("filter_lagerplatz").value.toLowerCase();

  const gefiltert = artikel.filter(a =>
    (a.standort || "").toLowerCase().includes(standort) &&
    (a.lagerplatz || "").toLowerCase().includes(lagerplatz)
  );

  renderInventurListe(gefiltert);
}

async function inventur(id, ist) {
  const aktuell = bestand(id);
  const diff = ist - aktuell;

  if (diff !== 0) {
    await client.from("lagerbewegungen").insert({
      artikel_id: id,
      menge: diff,
      typ: "inventur"
    });
  }

  await load();
  renderInventur(); // 👉 bleibt im Inventur-Tab
}

// ---------------- EINGANG ----------------
function renderEingang() {
  let html = `<h2>➕ Wareneingang</h2>`;

  artikel.forEach(a => {
    html += `
    <div class="card">
      <b>ID: ${a.id}</b><br>Name: ${a.name}<br>
      Bestand: ${bestand(a.id)}<br>
      <input type="number" id="m${a.id}">
      <button onclick="buchen(${a.id})">Buchen</button>
    </div>`;
  });

  document.getElementById("eingang").innerHTML = html;
}

async function buchen(id) {
  const menge = document.getElementById("m" + id).value;

  await client.from("lagerbewegungen").insert({
    artikel_id: id,
    menge: parseInt(menge),
    typ: "wareneingang"
  });

  await load();
  renderEingang(); // 👉 bleibt im Eingang
}

// ---------------- ADMIN + ARTIKEL HINZUFÜGEN ----------------
function renderAdmin() {
  let html = `<h2>📊 Bestand</h2>

  <input placeholder="🔍 Suche nach Name oder ID" oninput="filterArtikel(this.value)">
  <select id="filter_admin_standort" onchange="filterArtikelExtended()">
    <option value="">Alle Standorte</option>
    ${[...new Set(artikel.map(a => a.standort || ""))].map(s => `<option value="${s}">${s}</option>`).join("")}
  </select>

  <select id="filter_admin_lagerplatz" onchange="filterArtikelExtended()">
    <option value="">Alle Lagerplätze</option>
    ${[...new Set(artikel.map(a => a.lagerplatz || ""))].map(l => `<option value="${l}">${l}</option>`).join("")}
  </select>

  <div class="card">
    <h3>➕ Neuer Artikel</h3>
    <input placeholder="ID" id="new_id">
    <input placeholder="Name" id="new_name">
    <input placeholder="Warengruppe" id="new_wg">
    <input placeholder="Standort" id="new_standort">
    <input placeholder="Lagerplatz" id="new_lp">
    <button onclick="addArtikel()">Speichern</button>
  </div>

  <div id="artikelListe"></div>`;

  document.getElementById("admin").innerHTML = html;

  renderArtikelListe(artikel);
}

function filterArtikelExtended() {
  const standort = document.getElementById("filter_admin_standort").value.toLowerCase();
  const lagerplatz = document.getElementById("filter_admin_lagerplatz").value.toLowerCase();

  const gefiltert = artikel.filter(a =>
    (a.standort || "").toLowerCase().includes(standort) &&
    (a.lagerplatz || "").toLowerCase().includes(lagerplatz)
  );

  renderArtikelListe(gefiltert);
}

function renderArtikelListe(liste) {
  let html = "";

  liste.forEach(a => {
    html += `
    <div class="card">
      <b>ID: ${a.id}</b><br>
      Name: ${a.name}<br>
      📍 ${a.lagerplatz}<br>
      Bestand: ${bestand(a.id)}
    </div>`;
  });

  document.getElementById("artikelListe").innerHTML = html;
}

function filterArtikel(suche) {
  suche = suche.toLowerCase();

  const gefiltert = artikel.filter(a =>
    a.name.toLowerCase().includes(suche) ||
    String(a.id).includes(suche)
  );

  renderArtikelListe(gefiltert);
}

async function addArtikel() {
  const id = parseInt(document.getElementById("new_id").value);
  const name = document.getElementById("new_name").value;
  const warengruppe = document.getElementById("new_wg").value;
  const standort = document.getElementById("new_standort").value;
  const lagerplatz = document.getElementById("new_lp").value;

  if (!id || !name) {
    alert("ID und Name sind Pflicht!");
    return;
  }

  const { error } = await client.from("artikel").insert({
    id,
    name,
    warengruppe,
    standort,
    lagerplatz
  });

  if (error) {
    alert("Fehler: " + error.message);
  } else {
    load();
  }
}

// ---------------- EXPORT ----------------
function renderExport() {
  document.getElementById("export").innerHTML = `
    <h2>📤 Export</h2>
    <button onclick="exportCSV()">CSV Export</button>
  `;
}

function exportCSV() {
  let csv = "Name;Lagerplatz;Bestand\n";

  artikel.forEach(a => {
    csv += `${a.name};${a.lagerplatz};${bestand(a.id)}\n`;
  });

  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "bestand.csv";
  a.click();
}

// ---------------- START ----------------
window.addEventListener("DOMContentLoaded", () => {
  load("admin"); // Start nur einmal auf Bestand
});
</script>

</body>
</html>

<script>
if (location.protocol.startsWith('http') && 'serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
