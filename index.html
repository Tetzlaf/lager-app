<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lager App</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f5f5f5;
}

.tab {
  display: none;
  padding: 10px;
  margin-bottom: 100px;
}

/* GRID = weniger scrollen */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

/* Karten */
.card {
  background: white;
  border-radius: 10px;
  padding: 10px;
  font-size: 14px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.1);
}

/* Inputs */
input, select {
  width: 100%;
  padding: 10px;
  margin: 6px 0;
  font-size: 16px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

/* Buttons */
button {
  width: 100%;
  padding: 10px;
  margin-top: 6px;
  font-size: 14px;
  border-radius: 8px;
  border: none;
  background: #333;
  color: white;
}

/* Bottom Navigation */
nav {
  display: flex;
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #333;
}

nav button {
  flex: 1;
  color: white;
  background: none;
  border: none;
  font-size: 14px;
  min-height: 70px;
}
</style>
</head>

<body>

<nav>
  <button onclick="showTab('inventur')">📦<br>Inventur</button>
  <button onclick="showTab('eingang')">➕<br>Eingang</button>
  <button onclick="showTab('admin')">📊<br>Bestand</button>
  <button onclick="showTab('export')">📤<br>Export</button>
</nav>

<div id="inventur" class="tab"></div>
<div id="eingang" class="tab"></div>
<div id="admin" class="tab"></div>
<div id="export" class="tab"></div>

<script>

// 🔗 Supabase
const client = supabase.createClient(
  "https://hptmgzugsfxbkxayoqwk.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhwdG1nenVnc2Z4Ymt4YXlvcXdrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5Njc1OTEsImV4cCI6MjA5MjU0MzU5MX0.wqIL8sXUMF9E5PBdHMBcY6d6fvPeEzU93GG4PNT7h2Y"
);

let artikel = [];
let bewegungen = [];
let currentTab = "admin";

// ---------------- LOAD ----------------
async function load(tab = null) {
  const { data: artikelData } = await client.from("artikel").select("*");
  const { data: bewegungenData } = await client.from("lagerbewegungen").select("*");

  artikel = artikelData || [];
  bewegungen = bewegungenData || [];

  if (tab) currentTab = tab;

  showTab(currentTab);
}

// ---------------- TAB ----------------
window.showTab = function(tab) {
  currentTab = tab;

  document.querySelectorAll(".tab").forEach(t => t.style.display = "none");
  document.getElementById(tab).style.display = "block";

  if (tab === "inventur") renderInventur();
  if (tab === "eingang") renderEingang();
  if (tab === "admin") renderAdmin();
  if (tab === "export") renderExport();
};

// ---------------- HELPER ----------------
function bestand(id) {
  return bewegungen
    .filter(b => b.artikel_id == id)
    .reduce((sum, b) => sum + b.menge, 0);
}

// ---------------- INVENTUR ----------------
function renderInventur() {
  let html = `
    <h2>📦 Inventur</h2>

    <select id="f_standort" onchange="filterInventur()">
      <option value="">Alle Standorte</option>
      ${[...new Set(artikel.map(a => a.standort))].map(s => `<option>${s}</option>`).join("")}
    </select>

    <select id="f_lp" onchange="filterInventur()">
      <option value="">Alle Lagerplätze</option>
      ${[...new Set(artikel.map(a => a.lagerplatz))].map(l => `<option>${l}</option>`).join("")}
    </select>

    <div id="inventurListe" class="grid"></div>
  `;

  document.getElementById("inventur").innerHTML = html;
  renderInventurListe(artikel);
}

function renderInventurListe(liste) {
  let html = "";

  liste.forEach(a => {
    html += `
      <div class="card">
        <b>${a.name}</b>
        <div>ID: ${a.id}</div>
        <div>${a.lagerplatz}</div>
        <div>Bestand: ${bestand(a.id)}</div>

        <input type="number" placeholder="Menge"
          onchange="inventur(${a.id}, this.value)">
      </div>
    `;
  });

  document.getElementById("inventurListe").innerHTML = html;
}

function filterInventur() {
  const s = document.getElementById("f_standort").value;
  const l = document.getElementById("f_lp").value;

  const gefiltert = artikel.filter(a =>
    (!s || a.standort === s) &&
    (!l || a.lagerplatz === l)
  );

  renderInventurListe(gefiltert);
}

async function inventur(id, ist) {
  ist = parseInt(ist);
  const diff = ist - bestand(id);

  if (!isNaN(diff) && diff !== 0) {
    await client.from("lagerbewegungen").insert({
      artikel_id: id,
      menge: diff,
      typ: "inventur"
    });
  }

  load();
}

// ---------------- EINGANG ----------------
function renderEingang() {
  let html = `<h2>➕ Wareneingang</h2><div class="grid">`;

  artikel.forEach(a => {
    html += `
      <div class="card">
        <b>${a.name}</b>
        <div>Bestand: ${bestand(a.id)}</div>

        <input type="number" id="m${a.id}" placeholder="Menge">
        <button onclick="buchen(${a.id})">Buchen</button>
      </div>
    `;
  });

  html += "</div>";
  document.getElementById("eingang").innerHTML = html;
}

async function buchen(id) {
  const menge = parseInt(document.getElementById("m"+id).value);

  if (!menge || isNaN(menge)) {
    alert("Menge eingeben");
    return;
  }

  await client.from("lagerbewegungen").insert({
    artikel_id: id,
    menge: menge,
    typ: "wareneingang"
  });

  load();
}

// ---------------- ADMIN ----------------
function renderAdmin() {
  let html = `
    <h2>📊 Bestand</h2>

    <input placeholder="🔍 Suche" oninput="filterArtikel(this.value)">

    <div id="liste" class="grid"></div>
  `;

  document.getElementById("admin").innerHTML = html;
  renderListe(artikel);
}

function renderListe(liste) {
  let html = "";

  liste.forEach(a => {
    html += `
      <div class="card">
        <b>${a.name}</b>
        <div>ID: ${a.id}</div>
        <div>${a.lagerplatz}</div>
        <div>Bestand: ${bestand(a.id)}</div>
      </div>
    `;
  });

  document.getElementById("liste").innerHTML = html;
}

function filterArtikel(suche) {
  suche = suche.toLowerCase();

  const gefiltert = artikel.filter(a =>
    a.name.toLowerCase().includes(suche) ||
    String(a.id).includes(suche)
  );

  renderListe(gefiltert);
}

// ---------------- EXPORT ----------------
function renderExport() {
  document.getElementById("export").innerHTML = `
    <h2>Export</h2>
    <button onclick="exportCSV()">CSV Export</button>
  `;
}

function exportCSV() {
  let csv = "Name;Bestand\n";

  artikel.forEach(a => {
    csv += `${a.name};${bestand(a.id)}\n`;
  });

  const blob = new Blob([csv]);
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "bestand.csv";
  a.click();
}

// ---------------- START ----------------
load("admin");

</script>

</body>
</html>
